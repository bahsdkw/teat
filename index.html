<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #0b0b0d;
    --panel: #161618;
    --panel-border: rgba(255,255,255,0.06);
    --text: #f2f2f3;
    --muted: rgba(242,242,243,0.42);
    --accent: #d8b568;
    --accent-dim: rgba(216,181,104,0.14);
    --btn-bg: #1f1f22;
    --btn-hover: #26262a;
    --btn-active: #1a1a1d;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 900px 600px at 50% 0%, rgba(255,255,255,0.035), transparent 60%),
      var(--bg);
  }

  .calculator {
    width: 320px;
    padding: 22px;
    border-radius: 24px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 10px 20px -10px rgba(0,0,0,0.5);
  }

  .title {
    text-align: center;
    margin: 2px 0 18px;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .display {
    border-radius: 14px;
    padding: 22px 16px 16px;
    margin-bottom: 16px;
    text-align: right;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .display .prev {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 400;
    min-height: 1.2rem;
    word-break: break-all;
  }
  .display .curr {
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--text);
    word-break: break-all;
    letter-spacing: -0.5px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 500;
    padding: 17px 0;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.06s ease, border-color 0.15s ease;
  }
  button:hover {
    background: var(--btn-hover);
    border-color: rgba(255,255,255,0.09);
  }
  button:active {
    background: var(--btn-active);
    transform: scale(0.97);
  }

  button.func {
    color: var(--muted);
    background: transparent;
  }
  button.func:hover {
    background: rgba(255,255,255,0.04);
    color: var(--text);
  }

  button.operator {
    color: var(--accent);
    background: var(--accent-dim);
    border-color: rgba(216,181,104,0.18);
  }
  button.operator:hover {
    background: rgba(216,181,104,0.22);
  }

  button.equals {
    grid-column: span 2;
    background: var(--accent);
    color: #1a140a;
    font-weight: 700;
    border: none;
  }
  button.equals:hover {
    background: #e2c27c;
  }
  button.equals:active {
    background: #cba756;
  }

  button.span2 { grid-column: span 2; }
</style>
</head>
<body>

<div class="calculator">
  <p class="title">Калькулятор</p>
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="curr" id="curr">0</div>
  </div>
  <div class="buttons">
    <button class="func" data-action="clear">C</button>
    <button class="func" data-action="delete">⌫</button>
    <button class="func" data-action="percent">%</button>
    <button class="operator" data-action="divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="operator" data-action="multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="operator" data-action="subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="operator" data-action="add">+</button>

    <button class="span2" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
  const prevEl = document.getElementById('prev');
  const currEl = document.getElementById('curr');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  const opSymbol = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

  function updateDisplay() {
    currEl.textContent = current;
    prevEl.textContent = previous !== null && operator
      ? `${formatNum(previous)} ${opSymbol[operator]}`
      : '';
  }

  function formatNum(n) {
    const num = parseFloat(n);
    if (Number.isNaN(num)) return '0';
    return num.toLocaleString('ru-RU', { maximumFractionDigits: 10 });
  }

  function inputNum(digit) {
    if (overwrite) {
      current = digit === '.' ? '0.' : digit;
      overwrite = false;
      return;
    }
    if (digit === '.' && current.includes('.')) return;
    if (current === '0' && digit !== '.') current = digit;
    else current += digit;
  }

  function compute() {
    const a = parseFloat(previous);
    const b = parseFloat(current);
    if (Number.isNaN(a) || Number.isNaN(b)) return b;
    switch (operator) {
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function setOperator(op) {
    if (operator && !overwrite) {
      previous = compute();
      current = String(previous);
    } else {
      previous = current;
    }
    operator = op;
    overwrite = true;
  }

  function equals() {
    if (operator === null) return;
    const result = compute();
    current = Number.isNaN(result) ? 'Ошибка' : String(round(result));
    previous = null;
    operator = null;
    overwrite = true;
  }

  function round(n) {
    return Math.round((n + Number.EPSILON) * 1e10) / 1e10;
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
  }

  function deleteLast() {
    if (overwrite) return;
    current = current.slice(0, -1);
    if (current === '' || current === '-') current = '0';
  }

  function percent() {
    current = String(round(parseFloat(current) / 100));
  }

  document.querySelector('.buttons').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.dataset.num !== undefined) {
      inputNum(btn.dataset.num);
    } else if (btn.dataset.action) {
      switch (btn.dataset.action) {
        case 'clear': clearAll(); break;
        case 'delete': deleteLast(); break;
        case 'percent': percent(); break;
        case 'equals': equals(); break;
        default: setOperator(btn.dataset.action);
      }
    }
    updateDisplay();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.') inputNum('.');
    else if (e.key === '+') setOperator('add');
    else if (e.key === '-') setOperator('subtract');
    else if (e.key === '*') setOperator('multiply');
    else if (e.key === '/') { e.preventDefault(); setOperator('divide'); }
    else if (e.key === 'Enter' || e.key === '=') equals();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
    else return;
    updateDisplay();
  });

  updateDisplay();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --text: #f5f6ff;
    --muted: rgba(245,246,255,0.55);
    --neon1: #ff2ec4;
    --neon2: #7c4dff;
    --neon3: #22e0ff;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 20%, #2b0b40 0%, #0a0a1a 55%),
                radial-gradient(circle at 80% 80%, #001a2e 0%, #0a0a1a 60%),
                #05050c;
    overflow: hidden;
    position: relative;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  .blob1 { width: 380px; height: 380px; background: var(--neon1); top: -100px; left: -100px; }
  .blob2 { width: 420px; height: 420px; background: var(--neon2); bottom: -140px; right: -120px; animation-delay: -4s; }
  .blob3 { width: 300px; height: 300px; background: var(--neon3); bottom: 10%; left: 15%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -40px) scale(1.1); }
  }

  .calculator {
    position: relative;
    z-index: 1;
    width: 340px;
    padding: 22px;
    border-radius: 26px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.15),
      0 0 60px rgba(124,77,255,0.25);
  }

  .display {
    border-radius: 16px;
    padding: 24px 18px 18px;
    margin-bottom: 18px;
    text-align: right;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.5);
  }
  .display .prev {
    color: var(--muted);
    font-size: 1rem;
    min-height: 1.3rem;
    word-break: break-all;
    letter-spacing: 0.5px;
  }
  .display .curr {
    font-size: 2.5rem;
    font-weight: 700;
    word-break: break-all;
    background: linear-gradient(90deg, var(--neon3), var(--neon2) 50%, var(--neon1));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(124,77,255,0.35);
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 1.15rem;
    font-weight: 500;
    padding: 18px 0;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover {
    background: rgba(255,255,255,0.14);
    box-shadow: 0 0 18px rgba(124,77,255,0.35);
  }
  button:active { transform: scale(0.94); }

  button.func {
    color: var(--neon3);
    border-color: rgba(34,224,255,0.35);
  }
  button.operator {
    background: linear-gradient(135deg, var(--neon2), var(--neon1));
    color: #fff;
    border: none;
    box-shadow: 0 6px 18px rgba(255,46,196,0.35);
  }
  button.operator:hover {
    box-shadow: 0 6px 26px rgba(255,46,196,0.55);
    filter: brightness(1.1);
  }
  button.equals {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--neon3), var(--neon2));
    color: #fff;
    border: none;
    font-weight: 700;
    box-shadow: 0 6px 22px rgba(34,224,255,0.4);
  }
  button.equals:hover {
    box-shadow: 0 6px 30px rgba(34,224,255,0.6);
    filter: brightness(1.1);
  }
  button.span2 { grid-column: span 2; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0);
    animation: ripple 0.5s ease-out;
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: scale(3); opacity: 0; }
  }

  .title {
    text-align: center;
    margin: 0 0 16px;
    font-size: 0.85rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="calculator">
  <p class="title">Калькулятор</p>
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="curr" id="curr">0</div>
  </div>
  <div class="buttons">
    <button class="func" data-action="clear">C</button>
    <button class="func" data-action="delete">⌫</button>
    <button class="func" data-action="percent">%</button>
    <button class="operator" data-action="divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="operator" data-action="multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="operator" data-action="subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="operator" data-action="add">+</button>

    <button class="span2" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
  const prevEl = document.getElementById('prev');
  const currEl = document.getElementById('curr');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  const opSymbol = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

  function updateDisplay() {
    currEl.textContent = current;
    prevEl.textContent = previous !== null && operator
      ? `${formatNum(previous)} ${opSymbol[operator]}`
      : '';
  }

  function formatNum(n) {
    const num = parseFloat(n);
    if (Number.isNaN(num)) return '0';
    return num.toLocaleString('ru-RU', { maximumFractionDigits: 10 });
  }

  function inputNum(digit) {
    if (overwrite) {
      current = digit === '.' ? '0.' : digit;
      overwrite = false;
      return;
    }
    if (digit === '.' && current.includes('.')) return;
    if (current === '0' && digit !== '.') current = digit;
    else current += digit;
  }

  function compute() {
    const a = parseFloat(previous);
    const b = parseFloat(current);
    if (Number.isNaN(a) || Number.isNaN(b)) return b;
    switch (operator) {
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function setOperator(op) {
    if (operator && !overwrite) {
      previous = compute();
      current = String(previous);
    } else {
      previous = current;
    }
    operator = op;
    overwrite = true;
  }

  function equals() {
    if (operator === null) return;
    const result = compute();
    current = Number.isNaN(result) ? 'Ошибка' : String(round(result));
    previous = null;
    operator = null;
    overwrite = true;
  }

  function round(n) {
    return Math.round((n + Number.EPSILON) * 1e10) / 1e10;
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
  }

  function deleteLast() {
    if (overwrite) return;
    current = current.slice(0, -1);
    if (current === '' || current === '-') current = '0';
  }

  function percent() {
    current = String(round(parseFloat(current) / 100));
  }

  function spawnRipple(btn, e) {
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    const size = Math.max(rect.width, rect.height);
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  document.querySelector('.buttons').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    spawnRipple(btn, e);

    if (btn.dataset.num !== undefined) {
      inputNum(btn.dataset.num);
    } else if (btn.dataset.action) {
      switch (btn.dataset.action) {
        case 'clear': clearAll(); break;
        case 'delete': deleteLast(); break;
        case 'percent': percent(); break;
        case 'equals': equals(); break;
        default: setOperator(btn.dataset.action);
      }
    }
    updateDisplay();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.') inputNum('.');
    else if (e.key === '+') setOperator('add');
    else if (e.key === '-') setOperator('subtract');
    else if (e.key === '*') setOperator('multiply');
    else if (e.key === '/') { e.preventDefault(); setOperator('divide'); }
    else if (e.key === 'Enter' || e.key === '=') equals();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
    else return;
    updateDisplay();
  });

  updateDisplay();
</script>

</body>
</html>
